name: Build Release Packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release Source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Verify Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Blocking Clippy Lints
        run: cargo clippy --package ip-discovery --no-default-features --features dns,stun -- -D warnings

      - name: Run Rust Tests With All Features
        run: cargo test --workspace --all-features

      - name: Run Feature Matrix
        run: |
          cargo test --package ip-discovery --no-default-features
          cargo test --package ip-discovery --no-default-features --features dns
          cargo test --package ip-discovery --no-default-features --features stun
          cargo test --package ip-discovery --no-default-features --features http
          cargo test --package ip-discovery --no-default-features --features dns,stun
          cargo test --package ip-discovery --no-default-features --features tokio

      - name: Check Documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Check Dependencies
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check

      - name: Install Node Dependencies
        run: npm ci
        working-directory: node

      - name: Build Local Native Bindings for Testing
        run: npm run build
        working-directory: node

      - name: Run Node Tests
        run: npm test
        working-directory: node

  build-node-bindings:
    name: Build Node Bindings - ${{ matrix.settings.target }}
    needs: verify
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Install dependencies
        run: npm ci
        working-directory: node

      - name: Build bindings
        run: npx napi build --release --platform --target ${{ matrix.settings.target }}
        working-directory: node

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: node/*.node
          if-no-files-found: error

  bundle-node-bindings:
    name: Bundle Node Bindings
    needs: build-node-bindings
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: node-bindings
          pattern: bindings-*
          merge-multiple: true

      - name: Upload combined artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-bindings-all
          path: node-bindings/*.node
          if-no-files-found: error
