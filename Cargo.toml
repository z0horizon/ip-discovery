[workspace]
members = ["ipd", "node"]
resolver = "3"

[package]
name = "ip-discovery"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
description = "A lightweight, high-performance library for detecting public IP addresses via DNS, HTTP, and STUN protocols"
license = "MIT OR Apache-2.0"
repository = "https://github.com/z0horizon/ip-discovery"
homepage = "https://github.com/z0horizon/ip-discovery"
documentation = "https://docs.rs/ip-discovery"
readme = "README.md"
authors = ["z0horizon"]
keywords = ["ip", "public-ip", "stun", "dns", "network"]
categories = ["network-programming", "command-line-utilities"]
include = [
  "/Cargo.toml",
  "/src/**",
  "/tests/**",
  "/examples/**",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.dist]
dist = false

[features]
default = ["dns", "stun"]
dns = []
http = ["dep:reqwest"]
stun = []
tokio = ["dep:tokio"]
async = ["tokio"]
all = ["dns", "http", "stun", "tokio"]
native-tls = ["reqwest?/native-tls"]

[dependencies]
getrandom = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["net", "time"], optional = true }

# Optional - HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros"] }

[[example]]
name = "simple"
required-features = ["tokio"]

[[example]]
name = "custom_providers"
required-features = ["tokio"]

[[example]]
name = "benchmark"
required-features = ["tokio", "all"]

[[example]]
name = "blocking"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
