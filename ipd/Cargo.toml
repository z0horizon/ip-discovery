[package]
name = "ipd"
version = "0.5.1"
edition = "2021"
rust-version = "1.85"
description = "CLI tool to discover your public IP address"
license = "MIT OR Apache-2.0"
repository = "https://github.com/z0horizon/ip-discovery"
homepage = "https://github.com/z0horizon/ip-discovery"
readme = "../README.md"
authors = ["z0horizon"]
keywords = ["ip", "public-ip", "cli", "network"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "ipd"

[package.metadata.dist]
dist = true

[dependencies]
ip-discovery = { version = "0.5", path = "..", default-features = false, features = ["dns", "stun", "http"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
